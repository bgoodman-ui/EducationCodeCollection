<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>If Loop - even/odd factory</title>
<style>
  :root {
    --bg: #f5f5f5;
    --fg: #222;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1b1b1b; --fg: #eee; }
  }
  :root[data-theme="dark"] { --bg: #1b1b1b; --fg: #eee; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  #wrap { max-width: 1200px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: auto; background: #f5f5f5; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1200" height="760"></canvas></div>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const MAX_ITEMS = 60;
const ON_MAIN_BELT = 0, ON_VBELT1 = 2, ON_VBELT2 = 3;

const rect = (x, y, w, h) => ({ x, y, w, h });
const horizontalbelt = (x, y) => rect(x, y, 450, 70);
const verticalbelt = (x, y) => rect(x, y, 70, 150);

// ---- layout ----
const belt = horizontalbelt(250, 280);
const beltspeed = 120;
const stripewidth = 20;
let stripeOffset = 0;

const machine = rect(150, 240, 100, 150);
const spawnPoint = { x: machine.x + machine.w, y: belt.y + belt.h / 2 - 15 };

const IfMachine = rect(belt.x + belt.w, 240, 250, 150);

// left belt = odds -> oddMachine, right belt = evens -> evenMachine
const vbelt1 = verticalbelt(IfMachine.x, IfMachine.y + IfMachine.h);
const vbelt2 = verticalbelt(IfMachine.x + IfMachine.w - 70, IfMachine.y + IfMachine.h);
const oddMachine = rect(vbelt1.x, vbelt1.y + vbelt1.h, 170, 150);
const evenMachine = rect(vbelt2.x, vbelt2.y + vbelt2.h, 170, 150);

// numbers that have arrived at each machine
const evens = [];
const odds = [];

const items = Array.from({ length: MAX_ITEMS }, () => ({ rect: rect(0, 0, 30, 30), active: false, onBelt: ON_MAIN_BELT }));
let spawnQueue = 0;
let NextItemId = 1;
let spawnTimer = 0;
const spawnInterval = 0.5;

// ---- table layout ----
const TABLE = { x: 150, y: 410, w: 450, headH: 32, rowH: 28, maxRows: 8 };

// ---- input box ----
const box1 = { r: rect(150, 50, 200, 40), text: "", typing: false, label: "How many packages coming in?" };

const mouse = { x: 0, y: 0 };
const hit = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

function toCanvas(e) {
  const b = canvas.getBoundingClientRect();
  return { x: (e.clientX - b.left) * canvas.width / b.width, y: (e.clientY - b.top) * canvas.height / b.height };
}

canvas.addEventListener("mousemove", e => {
  Object.assign(mouse, toCanvas(e));
  canvas.style.cursor = hit(mouse, box1.r) ? "text" : "default";
});

canvas.addEventListener("mousedown", e => {
  Object.assign(mouse, toCanvas(e));
  box1.typing = hit(mouse, box1.r);
});

window.addEventListener("keydown", e => {
  if (!box1.typing) return;
  if (e.key >= "0" && e.key <= "9" && e.key.length === 1 && box1.text.length < 7) {
    box1.text += e.key;
  } else if (e.key === "Backspace") {
    box1.text = box1.text.slice(0, -1);
    e.preventDefault();
  } else if (e.key === "Enter" && box1.text.length > 0) {
    const n = parseInt(box1.text, 10);
    if (n > 0) {
      // starting a new run: if the last one has fully finished, reset everything
      if (spawnQueue === 0 && !items.some(i => i.active)) {
        evens.length = 0;
        odds.length = 0;
        NextItemId = 1;
        spawnTimer = 0;
      }
      spawnQueue += n;
    }
    box1.text = "";
    box1.typing = false;
  }
});

// ---- update ----
function moveItem(it, dt) {
  switch (it.onBelt) {
    case ON_MAIN_BELT:
      it.rect.x += beltspeed * dt;
      if (it.rect.x > belt.x + belt.w) {
        // the IF machine: even -> right belt, odd -> left belt
        const vb = (it.id % 2 === 0) ? vbelt2 : vbelt1;
        it.onBelt = (it.id % 2 === 0) ? ON_VBELT2 : ON_VBELT1;
        it.rect.x = vb.x + (vb.w - it.rect.w) / 2;
        it.rect.y = vb.y;
      }
      break;
    case ON_VBELT1:
      it.rect.y += beltspeed * dt;
      if (it.rect.y > vbelt1.y + vbelt1.h) { it.active = false; odds.push(it.id); }
      break;
    case ON_VBELT2:
      it.rect.y += beltspeed * dt;
      if (it.rect.y > vbelt2.y + vbelt2.h) { it.active = false; evens.push(it.id); }
      break;
  }
}

let beltRunning = false;

function update(dt) {
  if (spawnQueue > 0) {
    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      const slot = items.find(i => !i.active);
      if (slot) {
        slot.active = true;
        slot.rect = rect(spawnPoint.x, spawnPoint.y, 30, 30);
        slot.onBelt = ON_MAIN_BELT;
        slot.id = NextItemId++;
        spawnQueue--;
      }
    }
  }

  beltRunning = items.some(i => i.active) || spawnQueue > 0;
  if (beltRunning) stripeOffset = (stripeOffset + beltspeed * dt) % (stripewidth * 2);

  for (const it of items) if (it.active) moveItem(it, dt);
}

// ---- drawing ----
const DARKGRAY = "#505050", GRAY = "#828282", LIGHTGRAY = "#c8c8c8", ORANGE = "#ffa100";
const RAYWHITE = "#f5f5f5", MAROON = "#be2837";

function fillRect(r, color) { ctx.fillStyle = color; ctx.fillRect(r.x, r.y, r.w, r.h); }
function strokeRect(r, thick, color) {
  ctx.strokeStyle = color; ctx.lineWidth = thick;
  ctx.strokeRect(r.x + thick / 2, r.y + thick / 2, r.w - thick, r.h - thick);
}
function text(str, x, y, size, color) {
  ctx.fillStyle = color; ctx.font = size + "px sans-serif"; ctx.textBaseline = "top";
  ctx.fillText(str, x, y);
}
function measure(str, size) { ctx.font = size + "px sans-serif"; return ctx.measureText(str).width; }
function centerText(str, cx, y, size, color) { text(str, cx - measure(str, size) / 2, y, size, color); }

function drawStripedBelt(r, horizontal) {
  fillRect(r, DARKGRAY);
  ctx.save();
  ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
  ctx.fillStyle = beltRunning ? GRAY : LIGHTGRAY;
  if (horizontal) {
    for (let x = r.x - stripewidth * 2 + stripeOffset; x < r.x + r.w; x += stripewidth * 2)
      ctx.fillRect(x, r.y, stripewidth, r.h);
  } else {
    for (let y = r.y - stripewidth * 2 + stripeOffset; y < r.y + r.h; y += stripewidth * 2)
      ctx.fillRect(r.x, y, r.w, stripewidth);
  }
  ctx.restore();
  strokeRect(r, 2, "#000");
}

function drawInput(b) {
  fillRect(b.r, b.typing ? "#e0eefb" : LIGHTGRAY);
  strokeRect(b.r, 2, b.typing ? "#0079f1" : GRAY);
  text(b.text + (b.typing && Math.floor(performance.now() / 500) % 2 ? "|" : ""), b.r.x + 10, b.r.y + 10, 20, "#000");
  text(b.label, b.r.x, b.r.y - 20, 14, DARKGRAY);
}

function drawTable() {
  const colW = TABLE.w / 2;
  const bodyH = TABLE.rowH * TABLE.maxRows;

  // header (Odd on the left, Even on the right)
  fillRect(rect(TABLE.x, TABLE.y, colW, TABLE.headH), DARKGRAY);
  fillRect(rect(TABLE.x + colW, TABLE.y, colW, TABLE.headH), DARKGRAY);
  centerText("Even (" + evens.length + ")", TABLE.x + colW * 1.5, TABLE.y + 8, 16, RAYWHITE);
  centerText("Odd (" + odds.length + ")", TABLE.x + colW / 2, TABLE.y + 8, 16, RAYWHITE);

  // body rows (show the latest maxRows entries in each column)
  const evenShown = evens.slice(-TABLE.maxRows);
  const oddShown = odds.slice(-TABLE.maxRows);
  for (let i = 0; i < TABLE.maxRows; i++) {
    const y = TABLE.y + TABLE.headH + i * TABLE.rowH;
    const bg = i % 2 === 0 ? "#ffffff" : "#ececec";
    fillRect(rect(TABLE.x, y, TABLE.w, TABLE.rowH), bg);
    if (i < evenShown.length) centerText(String(evenShown[i]), TABLE.x + colW * 1.5, y + 6, 16, "#000");
    if (i < oddShown.length) centerText(String(oddShown[i]), TABLE.x + colW / 2, y + 6, 16, "#000");
  }

  // grid lines
  ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
  ctx.strokeRect(TABLE.x + 1, TABLE.y + 1, TABLE.w - 2, TABLE.headH + bodyH - 2);
  ctx.beginPath();
  ctx.moveTo(TABLE.x + colW, TABLE.y); ctx.lineTo(TABLE.x + colW, TABLE.y + TABLE.headH + bodyH);
  ctx.moveTo(TABLE.x, TABLE.y + TABLE.headH); ctx.lineTo(TABLE.x + TABLE.w, TABLE.y + TABLE.headH);
  ctx.stroke();

  // overflow note
  const hidden = Math.max(evens.length, odds.length) - TABLE.maxRows;
  if (hidden > 0) text("Showing latest " + TABLE.maxRows + " per column", TABLE.x, TABLE.y + TABLE.headH + bodyH + 8, 14, DARKGRAY);
}

function draw() {
  fillRect(rect(0, 0, canvas.width, canvas.height), RAYWHITE);

  fillRect(machine, DARKGRAY);
  text("MACHINE", machine.x + 5, machine.y + machine.h / 2 - 10, 14, RAYWHITE);

  fillRect(IfMachine, DARKGRAY);
  centerText("IF", IfMachine.x + IfMachine.w / 2, IfMachine.y + 10, 27, RAYWHITE);
  centerText("number is even?", IfMachine.x + IfMachine.w / 2, IfMachine.y + 55, 16, RAYWHITE);
  text("NO: left", IfMachine.x + 10, IfMachine.y + IfMachine.h - 28, 14, RAYWHITE);
  const noLabel = "YES: right";
  text(noLabel, IfMachine.x + IfMachine.w - 10 - measure(noLabel, 14), IfMachine.y + IfMachine.h - 28, 14, RAYWHITE);

  drawStripedBelt(belt, true);
  drawStripedBelt(vbelt1, false);
  drawStripedBelt(vbelt2, false);

  // left box: Odd
  fillRect(oddMachine, DARKGRAY);
  text("Odd", oddMachine.x + 5, oddMachine.y + 10, 20, RAYWHITE);
  text("Count", oddMachine.x + 5, oddMachine.y + 38, 14, RAYWHITE);
  text(String(odds.length), oddMachine.x + 5 + measure("Count", 14) + 8, oddMachine.y + 36, 18, RAYWHITE);

  // right box: Even
  fillRect(evenMachine, DARKGRAY);
  text("Even", evenMachine.x + 5, evenMachine.y + 10, 20, RAYWHITE);
  text("Count", evenMachine.x + 5, evenMachine.y + 38, 14, RAYWHITE);
  text(String(evens.length), evenMachine.x + 5 + measure("Count", 14) + 8, evenMachine.y + 36, 18, RAYWHITE);

  for (const it of items) {
    if (!it.active) continue;
    fillRect(it.rect, ORANGE);
    const label = String(it.id);
    text(label, it.rect.x + it.rect.w / 2 - measure(label, 14) / 2, it.rect.y + it.rect.h / 2 - 7, 14, "#000");
  }

  drawTable();

  drawInput(box1);

  if (spawnQueue > 0) text("Sending " + spawnQueue + " more...", 150, 200, 20, MAROON);
}

// ---- main loop ----
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
